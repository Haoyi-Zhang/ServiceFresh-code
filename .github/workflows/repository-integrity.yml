name: Repository integrity
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '10'
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Prepare raw output directory
        run: mkdir -p "$RUNNER_TEMP/p101-material"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate supplied materials and source/configuration syntax
        shell: bash
        run: |
          set -euo pipefail
          python -B .github/scripts/check_repository.py 2>&1 | tee "$RUNNER_TEMP/p101-material/integrity.log"
      - name: Upload raw integrity output even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p101-material-raw
          path: ${{ runner.temp }}/p101-material
          if-no-files-found: warn
          retention-days: 14
